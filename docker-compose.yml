# MongoDB local como replica set de un nodo (necesario para usar transacciones).
# Uso: docker compose up -d   ->  MONGODB_URI=mongodb://127.0.0.1:27017/catalogo_db?replicaSet=rs0
services:
  mongo:
    image: mongo:7
    container_name: catalogo-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      # Inicia el replica set la primera vez y luego solo comprueba que esté activo.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
volumes:
  mongo-datos:
